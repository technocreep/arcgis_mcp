services:

  # ---------------------------------------------------------------------------
  # gis-loader — Ingestion API (FastAPI)
  # Веб-интерфейс для загрузки проектов (.gdb + .aprx).
  # Доступ: http://localhost:10003
  # Учётные данные: GIS_USERNAME / GIS_PASSWORD
  # ---------------------------------------------------------------------------
  gis-loader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gis-loader-server
    command: ["uvicorn", "arcgis_mcp.ingestion.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "10003:8000"
    volumes:
      - projects:/app/projects            # общий том с gis-mcp
      - ./arcgis_mcp:/app/arcgis_mcp      # горячая перезагрузка кода при разработке
    environment:
      - PROJECTS_DIR=/app/projects
      - GIS_USERNAME=${GIS_USERNAME:-admin}
      - GIS_PASSWORD=${GIS_PASSWORD:-secret}
      - DATACUBE_URL=http://data-cube-server:8000
    env_file:
      - .env
    depends_on:
      - data-cube
      - neo4j
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # gis-mcp — OpenAPI Tool Server (FastAPI)
  # Доступен для Open WebUI как OpenAPI-инструменты.
  # Подключение в Open WebUI: http://localhost:10002/openapi.json
  # Swagger UI: http://localhost:10002/docs
  # ---------------------------------------------------------------------------
  gis-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gis-mcp-server
    command: ["uvicorn", "arcgis_mcp.api_server.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "10002:8000"
    volumes:
      - projects:/app/projects            # читает те же проекты, что загрузил gis-loader
      - ./arcgis_mcp:/app/arcgis_mcp
    env_file:
      - .env
    environment:
      - PROJECTS_DIR=/app/projects        # переопределяет значение из .env, если оно там есть
    restart: unless-stopped
    depends_on:
      - gis-loader

  data-cube:
    build:
      context: .
      dockerfile: Dockerfile.datacube
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        CACHE_BUST: ${CACHE_BUST:-1}
    container_name: data-cube-server
    volumes:
      - projects:/app/projects
      - ./Data_cube:/app/data_cube  # локальный сабмодуль монтируется поверх клонированного кода
    env_file:
      - .env
    environment:
      - PROJECTS_DIR=/app/projects
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # neo4j — Knowledge Graph (глобальный, все проекты)
  # Браузер: http://localhost:7474  (neo4j / NEO4J_PASSWORD)
  # Bolt:    bolt://localhost:7687
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: gis-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-gis_password}
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: wget -q --spider http://localhost:7474 || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  projects:
  neo4j_data:
